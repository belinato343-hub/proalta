<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#0c9789" />
    <title>ProAlta — Sem conexão</title>
    <style>
      :root { --background: #f8fafc; --foreground: #202b36; --primary: #0c9789; --primary-foreground: #fff; }
      * { box-sizing: border-box; }
      body { margin: 0; min-height: 100vh; display: grid; place-items: center; background: var(--background); color: var(--foreground); font-family: system-ui, sans-serif; padding: 24px; }
      main { max-width: 420px; text-align: center; }
      img { width: 96px; height: 96px; }
      h1 { font-size: 28px; } p { line-height: 1.6; }
      a { display: inline-block; padding: 12px 20px; border-radius: 8px; background: var(--primary); color: var(--primary-foreground); text-decoration: none; }
    </style>
  </head>
  <body>
    <main>
      <img src="/icons/proalta-192.png" alt="ProAlta" />
      <h1>Você está sem conexão</h1>
      <p>Conecte-se à internet para acessar sua conta, carregar vídeos, consultar dados ou enviar mensagens.</p>
      <a href="/">Tentar novamente</a>
    </main>
  </body>
</html>
